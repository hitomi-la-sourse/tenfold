services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GAME_SERVER_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      NODE_ENV: production
      WEB_ORIGIN: http://localhost:3000
      GAME_SERVER_PORT: 3001
      ROOM_TTL_MINUTES: 60
      FINISHED_ROOM_TTL_MINUTES: 30
      RECONNECT_GRACE_SECONDS: 60
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
